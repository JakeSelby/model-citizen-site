<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model Citizen, Open Graph card</title>
<link rel="stylesheet" href="../src/styles/global.css">
<!-- Fonts: Inter and Source Serif 4, both SIL OFL 1.1, loaded from Google Fonts at render time. No font software is bundled here. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,600&display=block">
<style>
  /* Editorial social-card typography; scope and license evidence live in brand/README.md. */
  .brand-card {
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { position: relative; font-family: var(--font-body); line-height: normal; text-align: center; }

  /* Essential content stays within the centered 630px square crop. */
  .mark { position: absolute; left: 0; right: 0; top: 78px; }
  .mark svg { width: 96px; height: 96px; display: inline-block; }

  h1 { position: absolute; left: 0; right: 0; top: 200px; font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -0.025em; font-variation-settings: normal; }

  .tagline { position: absolute; left: 0; right: 0; top: 312px; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.2; color: var(--amber-text); }

  .runtimes { position: absolute; left: 0; right: 0; top: 440px; }
  .runtimes .label { display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-2); margin-bottom: 18px; }
  .runtimes .row { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .chip { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; padding: 18px 30px 20px; border-radius: 999px; background: var(--fg); color: var(--bg); }
</style>
</head>
<body class="brand-card">
  <div class="mark">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="0.125" y="0.125" width="15.75" height="15.75" rx="2" fill="var(--raised)" stroke="var(--border)" stroke-width="0.25"/>
      <circle cx="8" cy="8.5" r="6.5" fill="var(--fg)"/>
      <path d="M9.6 6.6 L12.1 3.6" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>Model Citizen</h1>
  <div class="tagline">The control plane for<br>your coding agents.</div>

  <div class="runtimes">
    <span class="label">Projected into</span>
    <div class="row"><div class="chip">Claude Code</div><div class="chip">Codex</div></div>
  </div>
</body>
</html>
